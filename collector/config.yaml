# g-i-q collector configuration
#
# Coordinate system (all values in percentage points, "pp"):
#   x = growth gap      = expected real GDP growth over the next 6-12 months  - trend_growth
#   y = inflation gap   = expected core PCE inflation over the next 6-12 months - inflation_target
# Quadrants: x>0,y<0 Goldilocks | x>0,y>0 Overheating | x<0,y>0 Stagflation | x<0,y<0 Disinflationary slowdown

params:
  trend_growth: 2.0          # % real GDP, US potential growth assumption
  inflation_target: 2.0      # % core PCE, Fed target
  stale_after_days: 60       # a house view older than this is drawn hollow and down-weighted
  stale_weight: 0.35         # weight multiplier for stale views
  model_weight_share: 0.40   # share of the blended mixture given to the hard-data model point
  mc_draws: 40000            # Monte Carlo draws for quadrant probabilities
  min_sigma: 0.25            # floor on any reported 1-sigma (pp)

llm:
  model: claude-opus-5-5
  effort: high
  max_searches_per_source: 6

# Houses whose market commentary is tracked.
# type: sell_side | buy_side | official   (three types -> three colors on the chart)
# hints: where to look first; the collector also searches the web.
sources:
  - id: gsam
    name: Goldman Sachs Asset Management
    short: GSAM
    type: buy_side
    hints: ["am.gs.com market pulse", "Goldman Sachs economics research outlook"]
    domains: ["am.gs.com", "goldmansachs.com"]
  - id: gs_research
    name: Goldman Sachs Research
    short: GS
    type: sell_side
    hints: ["Goldman Sachs economists US GDP core PCE forecast"]
    domains: ["goldmansachs.com"]
  - id: jpm
    name: J.P. Morgan
    short: JPM
    type: sell_side
    hints: ["J.P. Morgan economic outlook", "JPMorgan Asset Management notes on the week ahead"]
    domains: ["jpmorgan.com", "am.jpmorgan.com"]
  - id: ms
    name: Morgan Stanley
    short: MS
