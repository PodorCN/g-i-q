    hints: ["BlackRock Global Weekly Commentary", "blackrock.com/corporate/insights/blackrock-investment-institute"]
    domains: ["blackrock.com"]
  - id: pimco
    name: PIMCO
    short: PIMCO
    type: buy_side
    hints: ["PIMCO Cyclical Outlook", "pimco.com/us/en/insights"]
    domains: ["pimco.com"]
  - id: vanguard
    name: Vanguard
    short: VG
    type: buy_side
    hints: ["corporate.vanguard.com economic and market outlook VEMO United States"]
    domains: ["corporate.vanguard.com", "vanguard.com"]
  - id: schwab
    name: Charles Schwab
    short: SCHW
    type: buy_side
    hints: ["Schwab's Market Perspective Liz Ann Sonders", "schwab.com/learn/market-commentary"]
