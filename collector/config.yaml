    domains: ["bofa.com", "ml.com"]
  - id: wells
    name: Wells Fargo
    short: WFC
    type: sell_side
    hints: ["Wells Fargo Economics outlook"]
    domains: ["wellsfargo.com", "wf.com", "wellsfargo.bluematrix.com"]
  - id: usbank
