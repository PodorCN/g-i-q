# Deploys the Cloudflare Worker (API) when backend code changes on main.
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
name: deploy-backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy-backend.yml"]
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
      - name: Verify the KV binding is configured
        id: kv
        run: |
          if grep -q 'REPLACE_WITH_KV_NAMESPACE_ID' backend/wrangler.toml; then
            echo "::notice::Set the GIQ KV namespace ID in backend/wrangler.toml before deploying the Worker."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: cloudflare/wrangler-action@v3
        if: steps.kv.outputs.ready == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy
