# Deploys the static site to Cloudflare Pages when frontend code changes on main.
# Data updates never trigger this; the page reads the API at runtime.
# Secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Variables: GIQ_API_URL (written into config.js at deploy time), CF_PAGES_PROJECT (default "g-i-q")
name: deploy-frontend

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/deploy-frontend.yml"]
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the API and configure the frontend
        id: api
        shell: bash
        env:
          API: ${{ vars.GIQ_API_URL }}
        run: |
          if [ -z "$API" ]; then
            echo "::notice::Set GIQ_API_URL to the Worker serving the dashboard snapshots."
            exit 0
          fi
          API="${API%/}"
          if ! curl --fail --silent --show-error --max-time 15 --proto '=https' -- "$API/api/latest" |
            jq -e '.schema_version == 1 and (.as_of | type == "string") and (.views | type == "array") and (.model.point | type == "object") and (.blend.blended | type == "object")' >/dev/null; then
            echo "::notice::The configured Worker must serve a v1 snapshot at /api/latest before Pages can deploy."
            exit 0
          fi
          printf 'window.GIQ_CONFIG = { apiBase: %s };\n' "$(jq -n --arg api "$API" '$api')" > frontend/config.js
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: cloudflare/wrangler-action@v3
        if: steps.api.outputs.ready == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend --project-name=${{ vars.CF_PAGES_PROJECT || 'g-i-q' }} --branch=main
