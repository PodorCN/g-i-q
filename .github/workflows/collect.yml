# Scheduled data refresh: FRED + Claude-scored house commentary -> snapshot -> backend.
# The frontend is never redeployed by this workflow.
#
# Secrets:   ANTHROPIC_API_KEY, GIQ_INGEST_TOKEN
# Variables: GIQ_API_URL  (e.g. https://giq-api.<subdomain>.workers.dev)
name: collect

on:
  schedule:
    - cron: "17 13 * * 1,4"   # Mon & Thu 13:17 UTC
  workflow_dispatch:
    inputs:
      skip_llm:
        description: "FRED only (carry house views forward)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install
        run: pip install -r collector/requirements.txt

      - name: Test
        working-directory: collector
        run: python -m pytest -q tests

      - name: Build snapshot
        working-directory: collector
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m giq.build ${{ inputs.skip_llm && '--skip-llm' || '' }}

      - name: Commit snapshot to the repo (audit trail)
        run: |
          git config user.name "giq-bot"
          git config user.email "giq-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: snapshot $(date -u +%F)"
          git push

      - name: Publish to backend
        if: ${{ vars.GIQ_API_URL != '' }}
        working-directory: collector
        env:
          GIQ_API_URL: ${{ vars.GIQ_API_URL }}
          GIQ_INGEST_TOKEN: ${{ secrets.GIQ_INGEST_TOKEN }}
        run: python -m giq.publish ../data/latest.json
